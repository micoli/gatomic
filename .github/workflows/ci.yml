name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: End to end
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "tester"
          cargo build --release
          bash tests/fixtures/init-test-repository.sh basic t
          cd tmp/t
          ../../target/release/gatomic --help

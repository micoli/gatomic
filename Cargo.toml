[package]
name = "gatomic"
version = "0.1.0"
edition = "2024"

[lib]
name = "gatomic"
path = "src/lib.rs"

[[bin]]
name = "gatomic"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
regex = "1"

[profile.release]
lto = true
strip = true
